<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
</head>
<body>
    <h1>Bienvenido a la tienda</h1>
    <div class="modal-ficha" id="modalFicha" hidden>
        <div class="modal-ficha__overlay" data-cerrar-ficha></div>

        <div class="modal-ficha__card" role="dialog" aria-modal="true" aria-labelledby="fichaTitulo">
            <button class="modal-ficha__cerrar" id="cerrarFicha" data-cerrar-ficha aria-label="Cerrar">&times;</button>

            <img class="modal-ficha__img" id="fichaImg" src="" alt="">
            <p class="modal-ficha__marca" id="fichaMarca"></p>
            <h2 class="modal-ficha__titulo" id="fichaTitulo"></h2>
            <span class="modal-ficha__precio" id="fichaPrecio"></span>
            <p class="modal-ficha__ml" id="fichaMl"></p>
            <p class="modal-ficha__desc" id="fichaDesc"></p>

            <ul class="modal-ficha__notas" id="fichaNotas"></ul>
            <p class="modal-ficha__genero">Género: <span id="fichaGenero"></span></p>

            <button class="modal-ficha__agregar" id="fichaAgregar">Agregar al carrito</button>
        </div>
    </div>
</body>
</html>
